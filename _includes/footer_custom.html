<style>
  .mobile-nav-footer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid #444;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .mobile-nav-footer .btn {
    font-size: 0.85rem !important;
    padding: 8px 12px !important;
  }
  html { scroll-behavior: smooth; }
</style>

<div class="mobile-nav-footer">
  {% unless page.url == "/" %}
  <a href="{{ '/' | relative_url }}" class="btn">🏠 Главная</a>
  {% endunless %}
  {% unless page.url contains "/stack" %}
  <a href="{{ '/stack' | relative_url }}" class="btn">🛠 Стек</a>
  {% endunless %}
  {% unless page.url contains "/projects" %}
  <a href="{{ '/projects' | relative_url }}" class="btn">📂 Кейсы</a>
  {% endunless %}
  {% unless page.url contains "/cv" %}
  <a href="{{ '/cv' | relative_url }}" class="btn">📄 Резюме</a>
  {% endunless %}
  <a href="#" class="btn">↑ Наверх</a>
</div>
