<style>
  html { scroll-behavior: smooth; }

  .site-footer-nav {
    margin-top: 2.5rem;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .site-footer-nav .btn {
    font-size: 0.85rem !important;
    padding: 8px 12px !important;
  }
  .site-footer-contacts {
    margin: 0.75rem 0 1rem;
    text-align: center;
    font-size: 0.8rem;
    color: #888;
  }
  .site-footer-contacts a { color: #5fb13b; text-decoration: none; margin: 0 8px; }
  .site-footer-contacts a:hover { color: #7dd356; }

  /* Десктоп: кнопки разделов скрыты (навигация — в сайдбаре).
     Мобилка: сайдбар свернут в гамбургер, кнопки — основная навигация. */
  @media (min-width: 50rem) {
    .site-footer-nav .nav-btn { display: none; }
  }
</style>

<div class="site-footer-nav">
  {% unless page.url == "/" %}
  <a href="{{ '/' | relative_url }}" class="btn nav-btn">🏠 Главная</a>
  {% endunless %}
  {% unless page.url contains "/stack" %}
  <a href="{{ '/stack' | relative_url }}" class="btn nav-btn">🛠 Стек</a>
  {% endunless %}
  {% unless page.url contains "/projects" %}
  <a href="{{ '/projects' | relative_url }}" class="btn nav-btn">📂 Кейсы</a>
  {% endunless %}
  {% unless page.url contains "/cv" %}
  <a href="{{ '/cv' | relative_url }}" class="btn nav-btn">📄 Резюме</a>
  {% endunless %}
  <a href="#" class="btn">↑ Наверх</a>
</div>
