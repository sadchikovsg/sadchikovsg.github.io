<!-- Mermaid.js for diagram rendering -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    theme: "dark",
    securityLevel: "loose",
    flowchart: { useMaxWidth: true, htmlLabels: true }
  });
</script>
