---
name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'assets/cv-one-page.html'
      - 'scripts/render-cv.js'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv-pdf
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject build metadata into HTML (values baked into PDF only)
        run: |
          sed -i "s|<!-- REVISION_LINE -->|<span>Revision: ${GITHUB_SHA:0:7}</span> \&middot; <span>Built: $(date -u +'%Y-%m-%d %H:%M UTC')</span> \&middot;|" assets/cv-one-page.html

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer --no-fund --no-audit

      - name: Render PDF
        run: node scripts/render-cv.js

      - name: Commit and push PDF
        run: |
          git config user.name "cv-bot"
          git config user.email "cv-bot@users.noreply.github.com"
          git add assets/CV_Sadchikovsg_DevOps.pdf
          if git diff --staged --quiet; then
            echo "PDF unchanged, nothing to commit"
          else
            git commit -m "chore: rebuild CV PDF (rev ${GITHUB_SHA:0:7})"
            git push
          fi
