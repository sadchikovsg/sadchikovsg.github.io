title: Сергей Садчиков | DevOps Engineer
description: Портфолио и техническая документация. Platform Engineering, CI/CD, IaC, Kubernetes.
url: "https://sadchikovsg.github.io"
baseurl: "" 

remote_theme: pages-themes/hacker@v0.2.0

color_scheme: dark
search_enabled: true
heading_anchors: true

# Mermaid diagrams - минимальная конфигурация
mermaid:
  version: "9.4.3"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# --- Custom Just the Docs Settings ---
# Включаем кнопку копирования для блоков кода
enable_copy_code_button: true

# Указываем кастомную цветовую схему (создадим её на Уровне 2)
color_scheme: custom

# Кастомный фавикон (положи файл favicon.png или .ico в корень)
favicon_ico: "/favicon.ico"
