title: Сергей Садчиков | DevOps Engineer
description: Портфолио и техническая документация. Platform Engineering, CI/CD, IaC, Kubernetes.
url: "https://sadchikovsg.github.io"
baseurl: "" 

remote_theme: pmarsceill/just-the-docs

# Включаем кастомную тему
color_scheme: custom

search_enabled: true
heading_anchors: true

# Включаем кнопку копирования для блоков кода
enable_copy_code_button: true

# Mermaid diagrams - минимальная конфигурация
mermaid:
  version: "9.4.3"

# favicon
favicon_ico: "/favicon.ico"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
