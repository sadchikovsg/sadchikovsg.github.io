# _config.yml
title: Сергей Садчиков | DevOps Engineer
description: Портфолио и техническая документация. Platform Engineering, CI/CD, IaC, Kubernetes.
url: "https://sadchikovsg.github.io" # Пока без кастомного домена
baseurl: "" 

# Подключение темы как удаленной зависимости
remote_theme: pmarsceill/just-the-docs

# Настройки Just the Docs
color_scheme: dark # Или light, по вкусу
search_enabled: true
heading_anchors: true

# Включаем поддержку Mermaid для схем архитектуры
mermaid:
  version: "9.1.3"

# Исключаем ненужные файлы из сборки
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Mermaid diagrams support
mermaid:
  version: "9.4.3"
  config: |
    {
      "startOnLoad": true,
      "theme": "dark",
      "securityLevel": "loose",
      "flowchart": {
        "useMaxWidth": true,
        "htmlLabels": true
      }
    }
